<!DOCTYPE html>
<html>
<head>
<title>Add Asset</title>
<style>
body{
font-family:Arial;
background:#f4f6f9;
padding:30px;
}

.container{
background:white;
padding:25px;
max-width:700px;
margin:auto;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h2{
color:#0d6efd;
text-align:center;
}

input, select{
width:100%;
padding:10px;
margin:10px 0;
border:1px solid #ccc;
border-radius:5px;
}

button{
background:#0d6efd;
color:white;
padding:12px;
border:none;
width:100%;
border-radius:5px;
cursor:pointer;
}

button:hover{
background:#084298;
}
</style>
</head>

<body>

<div class="container">

<h2>Add New ICT Asset</h2>

<form id="assetForm">

<label>Asset Name</label>
<input type="text" id="assetName" placeholder="Enter Asset Name" required>
<label>Category</label>

<select id="category">
    <option>Computer</option>
    <option>Printer</option>
    <option>Router</option>
    <option>Switch</option>
    <option>Server</option>
</select>

<label>Serial Number</label>
<input type="text" id="serialNumber" placeholder="Enter Serial Number" required>

<label>Purchase Date</label>
<input type="date" id="purchaseDate" required>

<label>Warranty End Date</label>
<input type="date" id="warrantyDate" required>

<label>Location</label>
<input type="text" id="location" placeholder="Asset Location" required>

<button type="submit">Add Asset</button>

</form>

</div>
<script>
document.getElementById("assetForm").addEventListener("submit", function(e){

    e.preventDefault();

    // Get form values
    const assetName = document.getElementById("assetName").value;
    const category = document.getElementById("category").value;
    const location = document.getElementById("location").value;

    // Create asset object
    const asset = {
        assetName: assetName,
        category: category,
        location: location,
        status: "Active"
    };

    // Get existing assets
    let assets = JSON.parse(localStorage.getItem("assets")) || [];

    // Add new asset
    assets.push(asset);

    // Save back to Local Storage
    localStorage.setItem("assets", JSON.stringify(assets));

    // Redirect to Asset List
    window.location.href = "asset_list.html";

});
</script>
</body>
</html>

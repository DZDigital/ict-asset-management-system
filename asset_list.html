<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ICT Asset Management System - Warranty Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f6f9;
        }

        .sidebar {
            height: 100vh;
            background: #0d6efd;
            color: white;
            padding: 20px;
        }

        .sidebar h2 {
            font-size: 20px;
            margin-bottom: 30px;
        }

        .sidebar a {
            display: block;
            color: white;
            padding: 10px;
            text-decoration: none;
            margin-bottom: 10px;
            border-radius: 5px;
        }

        .sidebar a:hover {
            background: #0b5ed7;
        }

        .card-box {
            padding: 20px;
            border-radius: 10px;
            color: white;
        }

        .active-box { background: #198754; }
        .expiring-box { background: #ffc107; color: black; }
        .expired-box { background: #dc3545; }

        .main {
            padding: 20px;
        }

        table {
            background: white;
            border-radius: 10px;
            overflow: hidden;
        }
    </style>
</head>

<body>

<div class="container-fluid">
    <div class="row">

        <!-- SIDEBAR -->
        <div class="col-md-2 sidebar">
           <h2>ICT Asset Management</h2>
            <a href="dashboard.html">Dashboard</a>
<a href="add_asset.html">Add Asset</a>
<a href="maintenance.html">Maintenance</a>
<a href="warranty_dashboard.html">Warranty</a>
<a href="usage-report.html">Usage Reports</a>
<a href="login.html">Logout</a>
        </div>

        <!-- MAIN CONTENT -->
        <div class="col-md-10 main">

        <h3>Asset List</h3>
<p>View all ICT assets added to the system.</p>

           <!-- SUMMARY CARDS -->
<div class="row mb-4">

</div>

            <!-- TABLE -->
            <table class="table table-bordered">
                <thead class="table-dark">
                   <tr>
    <th>Asset Name</th>
    <th>Category</th>
    <th>Location</th>
    <th>Status</th>
    <th>Action</th>
</tr>
                    </tr>
                </thead>

                    <tbody>
 <tbody id="assetTable">
</tbody>   
            </table>

        </div>
    </div>
</div>
<script>
let assets = JSON.parse(localStorage.getItem("assets")) || [];

let table = document.getElementById("assetTable");

assets.forEach(function(asset, index){

    table.innerHTML += `
        <tr>
            <td>${asset.assetName}</td>
            <td>${asset.category}</td>
            <td>${asset.location}</td>
            <td><span class="badge bg-success">${asset.status}</span></td>
            <td>
                <button class="btn btn-danger btn-sm" onclick="deleteAsset(${index})">
                    Delete
                </button>
            </td>
        </tr>
    `;

});

function deleteAsset(index) {

    if (confirm("Are you sure you want to delete this asset?")) {

        assets.splice(index, 1);

        localStorage.setItem("assets", JSON.stringify(assets));

        location.reload();

    }

}
</script>
</body>
</html>
